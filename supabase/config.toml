
[functions.criar-usuario]
enabled = true
# A própria função valida o token e exige perfil Administrador (admin.auth.getUser + perfis).
# Desligar a checagem do gateway evita falhas de CORS/preflight e com as novas chaves do Supabase.
verify_jwt = false
entrypoint = "./functions/criar-usuario/index.ts"

[functions.enviar-push]
enabled = true
verify_jwt = false
import_map = "./functions/enviar-push/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/enviar-push/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/enviar-push/*.html" ]
